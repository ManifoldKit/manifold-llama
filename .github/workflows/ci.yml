name: CI

on:
  # Skip the heavy macOS build+test on docs/version-only changes — notably
  # release-please PRs and their merge commits, which touch only CHANGELOG.md
  # and .release-please-manifest.json. `test` is a required check, so a skipped
  # release PR stays BLOCKED and must be admin-merged (gh api PUT .../merge) —
  # which is already the release flow (Highlights rewrite is hand-merged). Any
  # PR touching Sources/Package/etc. is unaffected and still runs the gate.
  #
  # DELIBERATE DIVERGENCE FROM manifold-eval (2026-07-29). eval removed this
  # filter from its `pull_request` trigger (eval#63) and then found the filter
  # was only HALF the reason its release PRs had no checks. With the filter
  # gone a run IS created, but it lands `action_required` — held pending
  # approval, because release-please posts as `app/github-actions` — and a held
  # run produces no check runs, so the PR still reads as unchecked. eval's
  # release flow is now: approve the held run via
  #   gh api -X POST repos/<owner>/<repo>/actions/runs/<id>/approve
  # then merge normally. That is a different manual step, not the absence of
  # one, and it would cost more here than in eval: removing the filter would
  # also start firing `scenario-override-sync` (a second macos-15 job) on
  # every release PR.
  #
  # This repo KEEPS the filter on purpose: Highlights are hand-edited, so a
  # human is merging the release either way, and the swap buys nothing here.
  # Do not "fix" this to match eval without re-deciding that trade. Removing
  # the manual step entirely would need release-please to post under an
  # App/PAT identity — that lives in ManifoldKit/.github's
  # companion-release-please.yml and is shared by all three repos, so it is
  # not a per-repo change. See eval's docs/AUTOMATION-STATUS.md.
  #
  # `types:` is load-bearing, but NOT for the reason this comment used to give.
  # The shared swift-ci.yml no longer SKIPS draft PRs — that guard was removed
  # precisely because a skipped job counts as PASSING for branch protection,
  # which let llama#153 (a `feat!:` change) merge on 2026-07-20 with the gate
  # never having built it. The job now always runs and FAILS FAST on a draft
  # (on ubuntu-latest, so no macOS minutes), so a draft shows a deliberate RED
  # check — expected, not a regression. `ready_for_review` is still required
  # here: without it, a PR opened as draft and later marked ready fires no
  # event this workflow subscribes to, so the real gate would never run and the
  # red would never clear. See ManifoldKit/.github WORKFLOWS.md.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Not covered by the shared swift-ci.yml (build+test only) — kept as its
  # own job here rather than folded into the reusable workflow. Runs on
  # macos-15 with no Xcode toolchain selection: the script is network-only
  # (raw.githubusercontent.com) and is written to stay macOS /bin/bash 3.2
  # compatible, matching where it ran before this migration.
  scenario-override-sync:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check scenario-override sync
        # Detects orphaned entries in Sources/manifold-tools-llama/ScenarioOverrides
        # (an override whose id no longer exists in ManifoldKit core's bundled
        # corpus at the resolved pin — scripts/check-vendored-sync.sh). Hard-fails
        # (--strict, the script's default) on a real orphan; network failures
        # still exit 0 (advisory only when connectivity itself is the problem,
        # not when the check actually ran).
        run: scripts/check-vendored-sync.sh

  # Required status check context becomes "test / build-and-test" (reusable
  # workflow calls report as "<caller job id> / <called job id>") — see the
  # "Required-check rename needed" note in the PR body. Job id kept as `test`
  # (matching the pre-migration required context name) to stay as close as
  # possible to the current required check.
  test:
    uses: ManifoldKit/.github/.github/workflows/swift-ci.yml@main
