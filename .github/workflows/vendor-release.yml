name: Vendor Release (llama.cpp xcframework)

# Publishes the vendored llama.cpp xcframework as a manifold-llama
# `vendor-llama-<BUILD>` release: runs scripts/repackage-xcframework.sh,
# uploads the slim zip + the PROVENANCE record it emits as release assets,
# and generates a signed `attest-build-provenance` statement over the slim
# zip so a consumer can prove the published bytes came from this workflow
# rather than a maintainer's laptop. Mirrors ManifoldKit core's
# release-provenance.yml. See docs/LLAMA_CONTRACT.md ("Trust chain" and
# "Slimming the xcframework") for the full chain and how to verify the
# attestation with `gh attestation verify`. Closes ManifoldKit/manifold-llama#161.
#
# Threat closed: previously the slim zip was hand-built and hand-uploaded
# from a maintainer's machine (the old manual step docs/LLAMA_CONTRACT.md
# described) — nothing bound the published bytes to a specific, inspectable
# build. This workflow makes that step reproducible-by-CI and signed.
#
# Deliberately NOT a PR/push-to-main trigger: `xcodebuild -create-xcframework`
# requires a macOS runner (10x billing), and this only needs to run on an
# actual vendor bump — never per-commit. Rehearsed without publishing by
# vendor-release-rehearsal.yml.
#
# Before dispatching for a new BUILD: add its upstream SHA256 as a `case`
# arm in `expected_upstream_sha256()` (scripts/repackage-xcframework.sh) —
# this workflow does not set ALLOW_UNVERIFIED_UPSTREAM, so an unpinned BUILD
# fails closed rather than repackaging an unverified download.
#
# Re-publish safety: the repackage step is NOT byte-reproducible (see
# docs/LLAMA_CONTRACT.md "Determinism caveat") — two runs for the SAME BUILD
# produce two DIFFERENT slim zips with two different checksums (measured:
# three independent local runs against the identical, checksum-verified
# upstream input yielded three different outputs). A re-dispatch that
# silently overwrites an already-published `vendor-llama-<BUILD>` asset
# would therefore break `Package.swift`'s pinned checksum for anyone who
# already resolved against it. The publish step below refuses to overwrite
# an existing asset unless `force: true` is explicitly passed.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Upstream llama.cpp build tag to publish (e.g. b9861). Must already have a case arm in expected_upstream_sha256()."
        required: true
        type: string
      force:
        description: "Overwrite an already-published vendor-llama-<BUILD> asset. DANGEROUS: the repackage is not byte-reproducible, so this WILL change the published checksum out from under Package.swift's existing pin and any consumer who already resolved against it. Only use to fix a genuinely botched publish, immediately followed by re-pinning Package.swift in the same breath."
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "vendor-llama-*"

concurrency:
  # Normalize both trigger paths to the SAME group key so a workflow_dispatch
  # for build: b9861 and a push of tag vendor-llama-b9861 serialise against
  # each other, not just against same-trigger reruns: github.ref_name for the
  # tag push is already "vendor-llama-b9861"; for dispatch we synthesize the
  # same "vendor-llama-<BUILD>" string from the input. (`&&`/`||` here use
  # GitHub Actions' value-returning semantics, not boolean coercion.)
  group: vendor-release-${{ github.event.inputs.build && format('vendor-llama-{0}', github.event.inputs.build) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Repackage, publish, and attest vendor-llama-<BUILD>
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # create the release + upload assets
      id-token: write # OIDC token for sigstore signing
      attestations: write # create the build-provenance attestation
    steps:
      - name: Resolve BUILD
        id: build
        env:
          INPUT_BUILD: ${{ github.event.inputs.build }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_BUILD}" ]]; then
            echo "value=${INPUT_BUILD}" >> "$GITHUB_OUTPUT"
          else
            # Tag is vendor-llama-<BUILD>.
            echo "value=${REF_NAME#vendor-llama-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight — refuse to clobber an already-published asset
        # Fast-fail before spending ~15-20 min of 10x-billed macOS on a
        # repackage (and minting a public Sigstore attestation over a zip
        # that would then never get published) if this BUILD's asset is
        # already on the release. This is a cheap early check, not the
        # authoritative one — the publish step below re-checks against the
        # actual produced filename right before uploading, since that's the
        # only point that can't be raced by another concurrent run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.build.outputs.value }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          TAG="vendor-llama-${BUILD}"
          ZIP_NAME="llama-${BUILD}-slim.xcframework.zip"
          if ASSET_NAMES="$(gh release view "${TAG}" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' 2>/dev/null)"; then
            if printf '%s\n' "${ASSET_NAMES}" | grep -qxF "${ZIP_NAME}"; then
              if [[ "${FORCE}" != "true" ]]; then
                echo "::error::${TAG} already has an asset named ${ZIP_NAME}. The repackage is not byte-reproducible (see docs/LLAMA_CONTRACT.md), so re-publishing would change the bytes behind Package.swift's existing pinned checksum for this BUILD out from under every consumer that already resolved against it. Re-dispatch with force: true ONLY to deliberately replace a botched publish, and re-pin Package.swift's checksum to the new run's value immediately afterward." >&2
                exit 1
              fi
              echo "::warning::force=true set — this run will overwrite the existing ${ZIP_NAME} on ${TAG} once repackaged. Package.swift's pinned checksum for this BUILD will need updating to this run's new value."
            fi
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest Xcode 26 toolchain
        # Same rationale as ci.yml / model-tests.yml: pick the newest
        # installed Xcode 26 rather than trust the runner image default.
        run: |
          xcodes=( /Applications/Xcode_26*.app )
          newest=$(printf '%s\n' "${xcodes[@]}" | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          swift --version

      - name: Repackage xcframework
        id: repackage
        env:
          BUILD: ${{ steps.build.outputs.value }}
          WORK_DIR: ${{ runner.temp }}/repackage-xcframework
          VENDOR_RELEASE_PUBLISH: "1" # marks this as THE authoritative run — see scripts/repackage-xcframework.sh's footer comment. NOT set by vendor-release-rehearsal.yml.
        run: |
          set -euo pipefail
          scripts/repackage-xcframework.sh
          ZIP="${WORK_DIR}/llama-${BUILD}-slim.xcframework.zip"
          PROVENANCE="${WORK_DIR}/PROVENANCE-${BUILD}.md"
          [[ -f "${ZIP}" ]] || { echo "::error::slim zip missing after repackage: ${ZIP}"; exit 1; }
          [[ -f "${PROVENANCE}" ]] || { echo "::error::provenance record missing after repackage: ${PROVENANCE}"; exit 1; }
          # Recompute the SwiftPM package checksum from the exact bytes the
          # script just produced, for the run summary only — the PROVENANCE
          # file already carries the authoritative value emitted by the
          # script itself, so nothing here can drift from what gets published.
          CHECKSUM="$(cd "$(dirname "${ZIP}")" && swift package compute-checksum "$(basename "${ZIP}")")"
          {
            echo "zip=${ZIP}"
            echo "provenance=${PROVENANCE}"
            echo "checksum=${CHECKSUM}"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the slim zip
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.repackage.outputs.zip }}

      - name: Create or refresh the vendor-llama-<BUILD> release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.build.outputs.value }}
          ZIP: ${{ steps.repackage.outputs.zip }}
          PROVENANCE: ${{ steps.repackage.outputs.provenance }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          TAG="vendor-llama-${BUILD}"
          ZIP_NAME="$(basename "${ZIP}")"
          if ASSET_NAMES="$(gh release view "${TAG}" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' 2>/dev/null)"; then
            # The repackage is NOT byte-reproducible (docs/LLAMA_CONTRACT.md
            # "Determinism caveat" — measured: three independent local runs
            # against the identical, checksum-verified upstream input
            # produced three different slim-zip checksums). Overwriting an
            # already-published asset for this BUILD would therefore silently
            # change the bytes behind Package.swift's existing pin for
            # anyone who already resolved against it, and every subsequent
            # `swift package resolve` against the OLD checksum would then
            # hard-fail. Refuse unless the caller explicitly opted in via the
            # `force` dispatch input, acknowledging that risk.
            if printf '%s\n' "${ASSET_NAMES}" | grep -qxF "${ZIP_NAME}"; then
              if [[ "${FORCE}" != "true" ]]; then
                echo "::error::${TAG} already has an asset named ${ZIP_NAME}. The repackage is not byte-reproducible (see docs/LLAMA_CONTRACT.md), so re-publishing would change the bytes behind Package.swift's existing pinned checksum for this BUILD out from under every consumer that already resolved against it. Re-dispatch with force: true ONLY if you are deliberately replacing a botched publish, and re-pin Package.swift's checksum to this run's new value immediately afterward." >&2
                exit 1
              fi
              echo "::warning::force=true set — overwriting the existing ${ZIP_NAME} on ${TAG}. Package.swift's pinned checksum for this BUILD is now stale and MUST be updated to this run's checksum."
            fi
            gh release upload "${TAG}" "${ZIP}" "${PROVENANCE}" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${TAG}" "${ZIP}" "${PROVENANCE}" \
              --repo "${{ github.repository }}" \
              --title "Vendored slim llama.cpp xcframework (${BUILD})" \
              --latest=false \
              --notes "Slim repackage of ggml-org/llama.cpp ${BUILD} (tvOS/visionOS slices + dSYMs dropped). See the attached PROVENANCE-${BUILD}.md and docs/LLAMA_CONTRACT.md for the trust chain, and verify this release's build provenance: download the asset (gh release download ${TAG} --pattern '*.zip'), then run gh attestation verify llama-${BUILD}-slim.xcframework.zip --repo ${{ github.repository }} against the downloaded file."
          fi

      - name: Persist artifacts on the workflow run
        # Belt-and-suspenders: if the release upload is rate-limited or the
        # release is later edited, the exact bytes (and their attestation in
        # the transparency log) are still recoverable from the run itself.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor-llama-${{ steps.build.outputs.value }}
          path: |
            ${{ steps.repackage.outputs.zip }}
            ${{ steps.repackage.outputs.provenance }}
          retention-days: 90

      - name: Summary
        env:
          BUILD: ${{ steps.build.outputs.value }}
          CHECKSUM: ${{ steps.repackage.outputs.checksum }}
        run: |
          {
            echo "### vendor-llama-${BUILD} published"
            echo
            echo "- Slim checksum (paste into \`Package.swift\`'s \`.binaryTarget(checksum:)\`): \`${CHECKSUM}\`"
            echo "- Verify provenance (download the asset first — \`gh attestation verify\` needs the actual bytes, not just a filename):"
            echo "  \`gh release download vendor-llama-${BUILD} --pattern '*.zip' --repo ${{ github.repository }} && gh attestation verify llama-${BUILD}-slim.xcframework.zip --repo ${{ github.repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
